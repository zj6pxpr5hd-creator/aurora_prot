# Runs Aurora as a Docker container. This is useful for testing and development purposes, as it allows you to run Aurora in a consistent environment without having to install dependencies on your local machine.
services:
  aurora:
# point to .env file for environment variables, which is useful for keeping sensitive information like API keys out of the codebase.
    env_file:
      - .env
# builds the Docker image for Aurora using the Dockerfile in the current directory. The image is named "aurora_service" and will be restarted unless stopped manually.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurora_service
    restart: unless-stopped
# maps port 5000 on the host machine to port 5000 in the container, allowing you to access the Aurora service from your local machine.
    ports:
      - "5000:5000"
# mounts the "data" directory on the host machine to "/app/server/data" in the container, allowing to persist data generated by Aurora across container restarts.
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_FILE=/app/server/data/aurora.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./data:/app/server/data